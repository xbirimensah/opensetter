# OpenSetter services.
#
# Full self-hosted stack (web + worker + Postgres + Redis):
#   ./scripts/setup.sh docker     # writes .env with generated secrets
#   docker compose up -d --build
#
# Local development (databases only, `npm run dev` on the host):
#   docker compose up -d postgres redis

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: opensetter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file: .env
    environment:
      MEDIA_DIR: /app/data/media
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Flow uploads and inbound DM media, shared with the worker.
      - media:/app/data/media

  worker:
    build: .
    command: ["npx", "tsx", "worker/dm-worker.ts"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      MEDIA_DIR: /app/data/media
    volumes:
      # Cache the locally downloaded embedding model across restarts.
      - hfcache:/root/.cache/huggingface
      - media:/app/data/media

volumes:
  pgdata:
  redisdata:
  hfcache:
  media:
